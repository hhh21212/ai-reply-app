name: ai_reply_app
description: 手机自用 AI 应答软件 —— 连接可配置 API，对话后自动提取摘要归档。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.20.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  share_plus: ^7.2.1
  cross_file: ^0.3.3+2
  shared_preferences_android: ">=2.4.28 <2.5.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
